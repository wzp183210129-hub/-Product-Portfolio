<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海睿星 · 智能客服 · 原型与交互设计</title>
<style>
:root {
  --c-bg: #f0f2f5;
  --c-white: #fff;
  --c-text: #1a1a1a;
  --c-muted: #6b7280;
  --c-border: #e5e7eb;
  --c-blue: #4F7DF5;
  --c-blue-dark: #3B6AE8;
  --c-blue-light: #eef3ff;
  --c-navy: #0f1729;
  --c-green: #059669;
  --c-green-light: #ecfdf5;
  --c-orange: #d97706;
  --c-orange-light: #fffbeb;
  --c-red: #dc2626;
  --c-red-light: #fef2f2;
  --c-purple: #7c3aed;
  --c-purple-light: #f5f3ff;
  --ai-bubble: #f0f7ff;
  --user-bubble: #4F7DF5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background: var(--c-navy);
  background-image:
    linear-gradient(rgba(79,125,245,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,125,245,.06) 1px, transparent 1px);
  background-size: 32px 32px;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}

/* ---- 全局容器 ---- */
.app-shell {
  width: 1300px; max-width: 100%;
  background: var(--c-white); border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.12);
  overflow: hidden; display: flex; flex-direction: column;
  min-height: 85vh; max-height: 95vh;
}

/* ---- 顶部导航 ---- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px;
  border-bottom: 1px solid var(--c-border);
  background: #fafbfc; flex-shrink: 0;
}
.topbar .logo {
  font-size: 17px; font-weight: 700; color: var(--c-text);
  display: flex; align-items: center; gap: 8px;
}
.topbar .logo .icon { font-size: 22px; }
.view-tabs {
  display: flex; gap: 4px; background: #f1f5f9; border-radius: 10px; padding: 3px;
}
.view-tab {
  padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; background: transparent; color: var(--c-muted);
  transition: all .15s; white-space: nowrap;
}
.view-tab.active { background: #fff; color: var(--c-text); box-shadow: var(--shadow-sm); }
.view-tab:hover:not(.active) { color: var(--c-text); }
.topbar .meta { font-size: 12px; color: var(--c-muted); display: flex; gap: 16px; }

/* ---- 主体区域 ---- */
.main-area { display: flex; flex: 1; overflow: hidden; }

/* ======================== C端：用户视角 ======================== */
.c-end { display: flex; flex: 1; flex-direction: column; background: var(--c-bg); }
.c-end.hidden { display: none; }

/* 聊天头部 */
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; background: #fff;
  border-bottom: 1px solid var(--c-border); flex-shrink: 0;
}
.chat-header .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #4F7DF5, #6B9AFF);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.chat-header .info { flex: 1; }
.chat-header .name { font-size: 15px; font-weight: 700; color: var(--c-text); }
.chat-header .sub { font-size: 12px; color: var(--c-muted); }
.chat-header .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c-green); }
.chat-header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); }

.scenario-bar {
  display: flex; gap: 8px; padding: 10px 20px; background: #fff;
  border-bottom: 1px solid var(--c-border); overflow-x: auto; flex-shrink: 0;
}
.scenario-chip {
  padding: 7px 12px; border-radius: 18px; border: 1px solid #dbeafe;
  background: #eff6ff; color: #1e40af; font-size: 12px; font-weight: 600;
  white-space: nowrap; cursor: pointer; transition: all .15s;
}
.scenario-chip:hover { background: #dbeafe; border-color: #93c5fd; }
.scenario-chip.warn { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
.scenario-chip.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

/* 聊天消息区 */
.chat-messages {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

/* 消息气泡 */
.msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn .3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }
.msg .avatar-sm {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
}
.msg.ai .avatar-sm { background: linear-gradient(135deg, #4F7DF5, #6B9AFF); }
.msg.user .avatar-sm { background: #f59e0b; }
.msg .bubble {
  padding: 12px 16px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.7; position: relative;
}
.msg.ai .bubble { background: #fff; border: 1px solid #e5e7eb; color: var(--c-text); }
.msg.user .bubble { background: var(--user-bubble); color: #fff; }
.msg .time { font-size: 11px; color: var(--c-muted); margin-top: 4px; }

/* AI消息内嵌元素 */
.msg.ai .confidence-tag {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px;
  margin-bottom: 6px; font-weight: 600;
}
.conf-high { background: #d1fae5; color: #065f46; }
.conf-mid { background: #fef3c7; color: #92400e; }
.conf-low { background: #fee2e2; color: #991b1b; }

.msg.ai .source-ref {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb;
  font-size: 12px; color: var(--c-muted);
  display: flex; align-items: center; gap: 4px; cursor: pointer;
}
.msg.ai .source-ref:hover { color: var(--c-blue); }
.msg.ai .source-pop {
  display: none; margin-top: 6px; padding: 10px 12px;
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
  font-size: 12px; color: #475569; line-height: 1.6;
}
.msg.ai .source-pop.show { display: block; }

.msg.ai .action-row {
  display: flex; gap: 8px; margin-top: 8px;
}
.msg.ai .btn-feedback {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid #e5e7eb;
  background: #fff; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.msg.ai .btn-feedback:hover { background: #f1f5f9; border-color: #94a3b8; }
.msg.ai .btn-feedback.active-good { background: #d1fae5; border-color: #059669; }
.msg.ai .btn-feedback.active-bad { background: #fee2e2; border-color: #dc2626; }

/* 待审核AI回答气泡 */
.draft-bubble {
  border: 2px dashed #f59e0b !important;
  background: #fffdf5 !important;
  position: relative;
}
.draft-badge {
  display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: #fef3c7; color: #92400e; font-weight: 700; margin-bottom: 8px;
  animation: pulse-border 2s infinite;
}
@keyframes pulse-border {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.4); }
  50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
}
.draft-actions {
  display: flex; gap: 8px; margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed #fcd34d;
}
.btn-approve {
  padding: 7px 18px; border-radius: 8px; border: none;
  background: #059669; color: #fff; cursor: pointer;
  font-size: 12px; font-weight: 700; transition: all .15s;
}
.btn-approve:hover { background: #047857; }
.btn-reject {
  padding: 7px 18px; border-radius: 8px; border: 1px solid #d1d5db;
  background: #fff; color: #6b7280; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all .15s;
}
.btn-reject:hover { border-color: #dc2626; color: #dc2626; }
.btn-edit-draft {
  padding: 7px 18px; border-radius: 8px; border: 1px solid #4F7DF5;
  background: #eef3ff; color: #4F7DF5; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all .15s;
}
.btn-edit-draft:hover { background: #dbeafe; }
.draft-approved { opacity: .7; pointer-events: none; }
.draft-approved .draft-badge { background: #d1fae5; color: #065f46; animation: none; }
.draft-approved .draft-actions { display: none; }

/* 侧边栏AI回答展示 */
.ai-answer-display {
  padding: 12px 14px; background: #fffdf5; border: 1px solid #fcd34d;
  border-radius: 8px; font-size: 13px; line-height: 1.7; margin-top: 8px;
  position: relative;
}
.ai-answer-display .answer-label {
  font-size: 11px; color: #92400e; font-weight: 700; margin-bottom: 6px;
  display: flex; align-items: center; gap: 4px;
}

/* 转人工提示卡片 */
.transfer-card {
  align-self: center; margin: 12px 0; padding: 16px 20px;
  background: #fff; border: 1px solid #fcd34d; border-radius: var(--radius);
  text-align: center; max-width: 280px; animation: msgIn .3s ease;
}
.transfer-card .icon { font-size: 32px; margin-bottom: 8px; }
.transfer-card .title { font-size: 14px; font-weight: 700; color: #92400e; }
.transfer-card .desc { font-size: 12px; color: var(--c-muted); margin: 4px 0 10px; }
.transfer-card .wait { font-size: 12px; color: var(--c-green); font-weight: 600; }
.transfer-card .steps {
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed #fde68a;
  text-align: left; font-size: 11px; color: #6b7280; line-height: 1.7;
}
.feedback-followup {
  margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  background: #fef2f2; border: 1px solid #fecaca; font-size: 12px; color: #991b1b;
}
.feedback-followup .mini-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.mini-btn {
  padding: 6px 10px; border-radius: 8px; border: 1px solid #fecaca;
  background: #fff; color: #991b1b; font-size: 12px; font-weight: 600; cursor: pointer;
}
.mini-btn:hover { background: #fee2e2; }

/* 快捷问题 */
.quick-asks {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0;
}
.quick-ask {
  padding: 6px 14px; border-radius: 20px; font-size: 12px;
  background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.quick-ask:hover { background: #dbeafe; }

/* 输入区 */
.chat-input-area {
  padding: 12px 20px; background: #fff; border-top: 1px solid var(--c-border);
  display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
}
.chat-input-area textarea {
  flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 24px;
  padding: 10px 18px; font-size: 14px; font-family: inherit; line-height: 1.5;
  min-height: 44px; max-height: 150px; outline: none;
  overflow-y: auto; transition: border-color .15s;
}
.chat-input-area textarea:focus { border-color: var(--c-blue); }
.chat-input-area .btn-send {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: var(--c-blue); color: #fff; cursor: pointer; font-size: 18px;
  flex-shrink: 0; transition: all .15s;
}
.chat-input-area .btn-send:hover { background: #3B6AE8; }
.chat-input-area .btn-send:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-transfer {
  padding: 8px 16px; border-radius: 20px; border: 1px solid #d1d5db;
  background: #fff; color: var(--c-muted); font-size: 12px; cursor: pointer;
  white-space: nowrap; transition: all .15s; flex-shrink: 0;
}
.btn-transfer:hover { border-color: #f59e0b; color: #92400e; }

/* 思考动画 */
.typing-dots { display: flex; gap: 4px; padding: 4px 0; }
.typing-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;
  animation: bounce 1.4s infinite ease-in-out both;
}
.typing-dots span:nth-child(1) { animation-delay: 0s; }
.typing-dots span:nth-child(2) { animation-delay: .16s; }
.typing-dots span:nth-child(3) { animation-delay: .32s; }
@keyframes bounce {
  0%,80%,100% { transform: scale(.6); }
  40% { transform: scale(1); }
}

/* ======================== B端：客服工作台 ======================== */
.b-end { display: none; flex: 1; background: #f8fafc; }
.b-end.hidden { display: none; }
.b-end.active { display: flex; }

/* 左侧会话列表 */
.conv-list {
  width: 280px; flex-shrink: 0; background: #fff;
  border-right: 1px solid var(--c-border); display: flex; flex-direction: column;
}
.conv-list .list-header {
  padding: 14px 16px; border-bottom: 1px solid var(--c-border);
  font-size: 14px; font-weight: 700; display: flex; justify-content: space-between;
}
.conv-list .list-header .count {
  font-size: 12px; color: var(--c-muted); font-weight: 400;
}
.conv-list .list-body { flex: 1; overflow-y: auto; }
.conv-item {
  padding: 14px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
  transition: background .15s; position: relative;
}
.conv-item:hover { background: #f8fafc; }
.conv-item.active { background: #eff6ff; border-left: 3px solid var(--c-blue); padding-left: 13px; }
.conv-item .conv-user { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.conv-item .conv-preview { font-size: 12px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-item .conv-time { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.conv-item .badge-urgent {
  position: absolute; top: 14px; right: 12px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--c-red);
}
.conv-item .badge-ai {
  position: absolute; top: 14px; right: 12px;
  font-size: 10px; padding: 2px 6px; border-radius: 10px;
  background: #dbeafe; color: #1e40af; font-weight: 600;
}
.conv-item .feedback-flag {
  display: inline-block; margin-top: 6px; padding: 2px 6px; border-radius: 8px;
  background: #fee2e2; color: #991b1b; font-size: 10px; font-weight: 700;
}

/* 中间对话区 */
.conv-main {
  flex: 1; display: flex; flex-direction: column; background: #f0f2f5;
  border-right: 1px solid var(--c-border);
}
.conv-main .chat-messages { background: #f0f2f5; }

/* 客服回复栏 */
.agent-reply-bar {
  padding: 12px 16px; background: #fff; border-top: 1px solid var(--c-border);
  display: flex; gap: 8px; align-items: flex-end;
}
.agent-reply-bar textarea {
  flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 10px;
  padding: 10px 14px; font-size: 14px; font-family: inherit; line-height: 1.6;
  min-height: 44px; max-height: 200px; outline: none;
  overflow-y: auto; transition: border-color .15s;
}
.agent-reply-bar textarea:focus { border-color: var(--c-blue); }
.agent-reply-bar .btn-send {
  padding: 10px 20px; border-radius: 10px; border: none;
  background: var(--c-blue); color: #fff; cursor: pointer;
  font-size: 14px; font-weight: 600; white-space: nowrap;
}
.agent-reply-bar .btn-send:hover { background: #3B6AE8; }

/* 右侧AI侧边栏 */
.ai-sidebar {
  width: 340px; flex-shrink: 0; background: #fff;
  display: flex; flex-direction: column; overflow-y: auto;
}
.ai-sidebar .section {
  padding: 14px 16px; border-bottom: 1px solid var(--c-border);
}
.ai-sidebar .section-title {
  font-size: 13px; font-weight: 700; color: var(--c-text);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.ai-sidebar .section-title .icon { font-size: 16px; }

/* 用户信息卡 */
.user-card {
  display: flex; gap: 12px; align-items: center;
}
.user-card .u-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: #f59e0b; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.user-card .u-info { flex: 1; font-size: 13px; line-height: 1.6; }
.user-card .u-name { font-weight: 700; }
.user-card .u-tags { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
.user-card .u-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.tag-vip { background: #fef3c7; color: #92400e; }
.tag-risk { background: #fee2e2; color: #991b1b; }
.tag-new { background: #dbeafe; color: #1e40af; }

/* AI检索结果 */
.ai-result-item {
  padding: 10px 12px; background: #f8fafc; border-radius: 8px;
  margin-bottom: 8px; border: 1px solid #e5e7eb; cursor: pointer;
  transition: all .15s; font-size: 12px;
}
.ai-result-item:hover { border-color: #93c5fd; background: #eff6ff; }
.ai-result-item .r-title { font-weight: 700; color: var(--c-text); margin-bottom: 2px; }
.ai-result-item .r-src { color: var(--c-muted); font-size: 11px; }
.ai-result-item .r-score {
  display: inline-block; font-size: 10px; padding: 1px 6px;
  border-radius: 8px; background: #d1fae5; color: #065f46; font-weight: 600;
  margin-left: 6px;
}

/* AI推荐话术 */
.script-card {
  padding: 10px 12px; background: #f0fdf4; border: 1px solid #bbf7d0;
  border-radius: 8px; margin-bottom: 8px; cursor: pointer;
  transition: all .15s; font-size: 13px; line-height: 1.6;
}
.script-card:hover { background: #dcfce7; }
.script-card .s-label { font-size: 11px; color: #059669; font-weight: 600; margin-bottom: 4px; }
.script-card .btn-use {
  margin-top: 6px; padding: 4px 12px; border-radius: 6px; border: 1px solid #059669;
  background: #fff; color: #059669; cursor: pointer; font-size: 11px; font-weight: 600;
}
.script-card .btn-use:hover { background: #059669; color: #fff; }

/* AI判断 */
.ai-judge {
  padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.6;
  margin-bottom: 6px;
}
.ai-judge.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
.ai-judge.warn { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }
.ai-judge.danger { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
.case-metric-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px;
}
.case-metric {
  padding: 8px 10px; background: #f8fafc; border: 1px solid #e5e7eb;
  border-radius: 8px; font-size: 12px;
}
.case-metric strong { display: block; color: var(--c-text); margin-bottom: 2px; }

/* 通知Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 600;
  z-index: 1000; animation: toastIn .3s ease, toastOut .3s ease 2s forwards;
  box-shadow: var(--shadow-md);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
.toast-success { background: #d1fae5; color: #065f46; }
.toast-info { background: #dbeafe; color: #1e40af; }

/* 满意度追问弹窗 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 500;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: #fff; border-radius: 16px; padding: 24px;
  width: 360px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-box h3 { font-size: 16px; margin-bottom: 14px; }
.modal-box .option {
  display: block; width: 100%; padding: 10px 14px; border-radius: 8px;
  border: 1px solid #e5e7eb; background: #fff; cursor: pointer;
  text-align: left; font-size: 13px; margin-bottom: 8px; transition: all .15s;
}
.modal-box .option:hover { background: #f1f5f9; border-color: #94a3b8; }
.modal-box .btn-close {
  margin-top: 8px; padding: 8px 20px; border-radius: 8px; border: none;

function addCMessage(role, content, opts = {}) {
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + role;

  const avatarText = role === 'user' ? '我' : '海睿';
  const time = opts.time || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  let bubbleHTML = '';
  bubbleHTML += content;

  if (role === 'ai' && opts.source) {
    bubbleHTML += `
      <div class="source-ref" onclick="toggleSource(this)">📎 参考来源：${opts.source} ▾</div>
      <div class="source-pop"><strong>检索来源：</strong><br>${opts.source}<br><br><strong>检索片段预览：</strong><br>${opts.sourcePreview || '（基于检索到的文档内容生成回答）'}</div>
    `;
  }

  if (role === 'ai' && !opts.noFeedback) {
    bubbleHTML += `
      <div class="action-row">
        <button class="btn-feedback" onclick="feedbackC(this, 'good', '${msgDiv.id || ''}')" title="有帮助">👍</button>
        <button class="btn-feedback" onclick="feedbackC(this, 'bad', '${msgDiv.id || ''}')" title="没帮助">👎</button>
      </div>
    `;
  }

  msgDiv.innerHTML = `
    <div class="avatar-sm">${avatarText}</div>
    <div><div class="bubble">${bubbleHTML}</div><div class="time">${time}</div></div>
  `;

  document.getElementById('c-messages').appendChild(msgDiv);
  scrollBottom('c-messages');
  return msgDiv;
}

function removeCTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();

function sendCMsg() {
  const input = document.getElementById('c-input');
  const text = input.value.trim();
  if (!text || transferRequested) return;

  input.value = '';
  autoResize(input);
  document.getElementById('c-send-btn').disabled = true;

  addCMessage('user', text);
  addCTyping();

  // 模拟AI思考延时
  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    removeCTyping();
    const resp = getAIResponse(text);

    if (resp.confidence === 'low') {
      addCMessage('ai', resp.text, { confidence: 'low', source: null, noFeedback: true });
      setTimeout(() => addTransferCard(), 800);
    } else if (resp.confidence === 'mid') {
      addCMessage('ai', '这个问题我正在为您核实，请稍等。', { noFeedback: true });
      // 模拟客服确认后再展示正式回复
      setTimeout(() => {
        showToast('✅ 客服已确认AI回答并发送', 'success');
        addCMessage('ai', resp.text, { source: resp.source, sourcePreview: getSourcePreview(text) });
      }, 2500);
    } else {
      addCMessage('ai', resp.text,
        { confidence: 'high', source: resp.source, sourcePreview: getSourcePreview(text) });
    }

    document.getElementById('c-send-btn').disabled = false;
    document.getElementById('c-input').focus();
  }, delay);
}

function handleCKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {

    sendCMsg();

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function useScript(text) {
  const input = document.getElementById('b-input');
  input.value = text;
  input.focus();
  autoResize(input);

  // 使用了推荐话术 → 自动忽略待审核回答
  dismissDraftIfPending();

  showToast('📋 话术已填入输入框，可修改后发送', 'success');
}

function dismissDraftIfPending() {
  const draftEl = document.querySelector('#b-messages .msg.ai .draft-bubble');
  if (!draftEl) return;
  const msgDiv = draftEl.closest('.msg');
  msgDiv.style.opacity = '0.4';
  const badge = msgDiv.querySelector('.draft-badge');
  if (badge) { badge.textContent = '⏭ 已选用推荐话术'; badge.style.background = '#dbeafe'; badge.style.color = '#1e40af'; badge.style.animation = 'none'; }
  const actions = msgDiv.querySelector('.draft-actions');
  if (actions) actions.remove();
}

function approveDraft(btn) {
  const draftEl = btn.closest('.msg');
  draftEl.classList.add('draft-approved');
  const badge = draftEl.querySelector('.draft-badge');
  if (badge) { badge.textContent = '✅ 已确认发送给用户'; badge.style.background = '#d1fae5'; badge.style.color = '#065f46'; }
  const actions = draftEl.querySelector('.draft-actions');
  if (actions) actions.remove();
  showToast('✅ AI回答已确认发送给用户「张先生」', 'success');
}

function approveDraftFromSidebar() {
  const draftEl = document.querySelector('#b-messages .msg.ai .draft-bubble');
  if (draftEl) {
    const msgDiv = draftEl.closest('.msg');
    msgDiv.classList.add('draft-approved');
    const badge = msgDiv.querySelector('.draft-badge');
    if (badge) { badge.textContent = '✅ 已确认发送给用户'; badge.style.background = '#d1fae5'; badge.style.color = '#065f46'; }
    const actions = msgDiv.querySelector('.draft-actions');
    if (actions) actions.remove();
  }
  showToast('✅ AI回答已确认发送给用户「张先生」', 'success');
}

function editDraft(btn) {
  const draftText = btn.closest('.msg').querySelector('.bubble').innerText.replace('⏳ AI生成 · 待客服审核确认\n', '').replace(/📎 参考来源：.*/, '').trim();
  const input = document.getElementById('b-input');
  input.value = draftText;
  input.focus();
  autoResize(input);
  showToast('✏️ AI回答已填入输入框，请修改后发送', 'info');
}

function editDraftFromSidebar() {
  const draftText = '非常抱歉给您带来不好的体验！根据您的订单ORD20260701001（T恤-白色L码，签收后第3天），该情况可能属于质量问题，支持发起售后处理。可优先协助您换新或申请退款，具体金额以售后审核结果为准。您更倾向哪种处理方式？';
  const input = document.getElementById('b-input');
  input.value = draftText;
  input.focus();
  autoResize(input);
  showToast('✏️ AI回答已填入输入框，请修改后发送', 'info');
}

function rejectDraft(btn) {
  const msgDiv = btn.closest('.msg');
  msgDiv.style.opacity = '0.4';
  const badge = msgDiv.querySelector('.draft-badge');
  if (badge) { badge.textContent = '✖ 已忽略，客服自行回复'; badge.style.background = '#fee2e2'; badge.style.color = '#991b1b'; }
  const actions = msgDiv.querySelector('.draft-actions');
  if (actions) actions.remove();
  document.getElementById('b-input').focus();
  showToast('✖ AI回答已拒绝，请自行输入回复', 'info');
}

function rejectDraftFromSidebar() {
  const draftEl = document.querySelector('#b-messages .msg.ai .draft-bubble');
  if (draftEl) {
    const msgDiv = draftEl.closest('.msg');
    msgDiv.style.opacity = '0.4';
    const badge = msgDiv.querySelector('.draft-badge');
    if (badge) { badge.textContent = '✖ 已忽略，客服自行回复'; badge.style.background = '#fee2e2'; badge.style.color = '#991b1b'; }
    const actions = msgDiv.querySelector('.draft-actions');
    if (actions) actions.remove();
  }
  document.getElementById('b-input').focus();
  showToast('✖ AI回答已拒绝，请自行输入回复', 'info');
}

function sendBMsg() {
  const input = document.getElementById('b-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResize(input);

  addBMessage('ai', text, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), { fromAgent: true });
  showToast('✅ 消息已发送', 'success');
}

function handleBKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBMsg();
  }
}
