:root[data-theme=&quot;light&quot;] {

    light-dark(rgb(255 255 255), rgb(24 24 24))

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;rule-import-demo&#x27;);
      const views = [...root.querySelectorAll(&#x27;.ri-view&#x27;)];
      const steps = [...root.querySelectorAll(&#x27;.ri-step&#x27;)];
      const input = root.querySelector(&#x27;#ri-file-input&#x27;);
      const dropzone = root.querySelector(&#x27;#ri-dropzone&#x27;);
      const fileRow = root.querySelector(&#x27;#ri-file-row&#x27;);
      const fileName = root.querySelector(&#x27;#ri-file-name&#x27;);
      const fileSize = root.querySelector(&#x27;#ri-file-size&#x27;);
      const uploadButton = root.querySelector(&#x27;#ri-upload&#x27;);
      let selectedFile = &#x27;&#x27;;
      let currentFilter = &#x27;all&#x27;;
      let activeRuleId = &#x27;ERP-DOC-001&#x27;;
      let ragReady = false;
      let retrievalPassed = false;
      let chunkCount = 0;

      const principles = [
        [&#x27;合同文件&#x27;, &#x27;盖章合同及附件优先，在线规则不得单方改变合同&#x27;, 98],
        [&#x27;服务范围&#x27;, &#x27;签约前明确模块、接口、迁移和追加收费边界&#x27;, 97],
        [&#x27;项目交付&#x27;, &#x27;明确里程碑、交付日期、延期责任和解除权&#x27;, 96],
        [&#x27;验收&#x27;, &#x27;仅以书面验收单为准，禁止默示验收&#x27;, 99],
        [&#x27;付款&#x27;, &#x27;付款与交付、验收及合格发票挂钩&#x27;, 98],
        [&#x27;价格&#x27;, &#x27;合同期内锁价，续订调价须书面确认&#x27;, 99],
        [&#x27;许可范围&#x27;, &#x27;覆盖约定主体，审计规则清晰合理&#x27;, 94],
        [&#x27;私有云边界&#x27;, &#x27;通过联合根因分析确定故障责任&#x27;, 95],
        [&#x27;远程运维&#x27;, &#x27;工单审批、实名账号、最小权限和全程留痕&#x27;, 98],
        [&#x27;SLA&#x27;, &#x27;约定可用率、响应、恢复和修复时限&#x27;, 97],
        [&#x27;数据使用&#x27;, &#x27;禁止未经同意用于训练、分析或商业展示&#x27;, 99],
        [&#x27;数据安全&#x27;, &#x27;数据原则上不离开私有云，事件立即通知&#x27;, 98],
        [&#x27;知识产权&#x27;, &#x27;区分底层产品与甲方付费定制成果&#x27;, 94],
        [&#x27;保密与分包&#x27;, &#x27;保密义务对等，重要分包须事先同意&#x27;, 96],
        [&#x27;责任限制&#x27;, &#x27;重大责任不得适用一般责任上限&#x27;, 98],
        [&#x27;终止与退出&#x27;, &#x27;终止权对等并提供退款、导出和迁移协助&#x27;, 97],
        [&#x27;续订与争议&#x27;, &#x27;禁止默认续订，重大通知实际送达&#x27;, 92]
      ];

      const rules = [
        [&#x27;ERP-DOC-001&#x27;,&#x27;在线规则不得优先于盖章合同&#x27;,&#x27;high&#x27;,1,&#x27;合同约定乙方产品规则、官网政策或后续更新文件具有更高效力。&#x27;,&#x27;双方盖章合同及附件具有最高效力；其他规则仅经甲方书面确认后生效。&#x27;],
        [&#x27;ERP-DOC-002&#x27;,&#x27;乙方不得单方变更合同内容&#x27;,&#x27;high&#x27;,1,&#x27;乙方可以通过通知、公告或后台更新单方变更服务范围、价格或责任。&#x27;,&#x27;任何实质性变更均须双方书面签署后生效。&#x27;],
        [&#x27;ERP-SCOPE-001&#x27;,&#x27;实施范围应在签约前明确&#x27;,&#x27;high&#x27;,2,&#x27;实施模块、交付物、接口数量或数据迁移范围在项目启动后再确定。&#x27;,&#x27;在附件中列明实施清单、成果、接口、数据范围和责任分工。&#x27;],
        [&#x27;ERP-SCOPE-002&#x27;,&#x27;追加收费须履行变更审批&#x27;,&#x27;medium&#x27;,2,&#x27;乙方可自行判断超出标准服务并直接按人天收费。&#x27;,&#x27;新增费用须由双方完成书面变更确认后发生。&#x27;],
        [&#x27;ERP-DELIVERY-001&#x27;,&#x27;必须约定确定的交付期限&#x27;,&#x27;high&#x27;,3,&#x27;交付周期仅为预计时间，且无延期责任或解除权。&#x27;,&#x27;明确里程碑和最终交付日，并约定延期责任及甲方解除权。&#x27;],
        [&#x27;ERP-ACCEPT-001&#x27;,&#x27;不得以沉默视为验收&#x27;,&#x27;high&#x27;,4,&#x27;甲方未在短期内提出异议即视为验收完成。&#x27;,&#x27;验收仅以双方签署的书面验收单为准。&#x27;],
        [&#x27;ERP-ACCEPT-002&#x27;,&#x27;登录试用不得构成验收&#x27;,&#x27;high&#x27;,4,&#x27;甲方登录、试用、培训或部分功能使用即视为整体验收。&#x27;,&#x27;试用、培训、登录及部分使用均不构成验收。&#x27;],
        [&#x27;ERP-PAY-001&#x27;,&#x27;付款节点必须与验收挂钩&#x27;,&#x27;high&#x27;,5,&#x27;甲方在最终验收前需支付大部分或全部合同价款。&#x27;,&#x27;按启动、初验、上线和终验分期付款。&#x27;],
        [&#x27;ERP-PAY-002&#x27;,&#x27;付款应以合格发票为前提&#x27;,&#x27;medium&#x27;,5,&#x27;合同排除发票作为付款前提或要求甲方先付款后开票。&#x27;,&#x27;每期付款以甲方收到合法有效发票为前提。&#x27;],
        [&#x27;ERP-PRICE-001&#x27;,&#x27;合同期内价格保持不变&#x27;,&#x27;high&#x27;,6,&#x27;乙方可在合同有效期内单方调整订阅价格。&#x27;,&#x27;合同有效期内价格锁定，不因乙方成本变化而调整。&#x27;],
        [&#x27;ERP-PRICE-002&#x27;,&#x27;续订调价须书面确认&#x27;,&#x27;medium&#x27;,6,&#x27;乙方通知后续订价格自动生效，甲方继续使用视为接受。&#x27;,&#x27;续订调价至少提前60日通知并经双方书面确认。&#x27;],
        [&#x27;ERP-LICENSE-001&#x27;,&#x27;授权主体范围应匹配实际使用&#x27;,&#x27;medium&#x27;,7,&#x27;软件仅限甲方本部使用，分支机构或关联公司需另行付费。&#x27;,&#x27;将约定的分公司、控股子公司和项目公司纳入授权范围。&#x27;],
        [&#x27;ERP-CLOUD-001&#x27;,&#x27;故障责任依据联合根因分析&#x27;,&#x27;high&#x27;,8,&#x27;原因不明或不能证明为代码问题的故障一律归责甲方环境。&#x27;,&#x27;双方联合开展根因分析，并按过错和因果关系承担责任。&#x27;],
        [&#x27;ERP-OPS-001&#x27;,&#x27;远程运维实行最小权限控制&#x27;,&#x27;high&#x27;,9,&#x27;乙方人员无需逐次审批即可访问日志、配置、数据库或业务数据。&#x27;,&#x27;实行工单审批、实名账号、双因素认证、最小权限和操作留痕。&#x27;],
        [&#x27;ERP-SLA-001&#x27;,&#x27;重大故障应约定恢复时限&#x27;,&#x27;high&#x27;,10,&#x27;重大故障仅约定首次响应时间，不约定恢复和修复目标。&#x27;,&#x27;P1故障30分钟响应、2小时提供临时方案、4小时恢复核心服务。&#x27;],
        [&#x27;ERP-SLA-002&#x27;,&#x27;SLA排除事项不得过宽&#x27;,&#x27;medium&#x27;,10,&#x27;版本升级、安全攻击、分包方或第三方服务故障均不计入不可用时间。&#x27;,&#x27;仅排除甲方单独原因及法定不可抗力。&#x27;],
        [&#x27;ERP-DATA-001&#x27;,&#x27;甲方数据不得用于模型训练&#x27;,&#x27;high&#x27;,11,&#x27;乙方可以将去标识化数据用于模型训练或产品开发。&#x27;,&#x27;未经甲方书面同意，不得将甲方数据用于训练或产品开发。&#x27;],
        [&#x27;ERP-DATA-002&#x27;,&#x27;甲方数据不得用于商业分析&#x27;,&#x27;high&#x27;,11,&#x27;乙方可将甲方数据用于行业分析、商业展示或向第三方提供。&#x27;,&#x27;不得将甲方数据用于行业分析、商业展示或向第三方提供。&#x27;],
        [&#x27;ERP-SEC-001&#x27;,&#x27;数据原则上不得离开甲方私有云&#x27;,&#x27;high&#x27;,12,&#x27;乙方可将数据副本保存至其自身或合作伙伴环境。&#x27;,&#x27;确需导出时须逐次审批、加密、限期删除并提供证明。&#x27;],
        [&#x27;ERP-SEC-002&#x27;,&#x27;安全事件应立即通知甲方&#x27;,&#x27;high&#x27;,12,&#x27;乙方完成内部核实后再决定是否通知安全事件。&#x27;,&#x27;发现安全事件后立即通知并持续通报处置进展。&#x27;],
        [&#x27;ERP-IP-001&#x27;,&#x27;甲方付费定制成果应获得持续权利&#x27;,&#x27;high&#x27;,13,&#x27;甲方付费形成的接口、脚本、报表和配置全部归乙方。&#x27;,&#x27;甲方至少获得永久、不可撤销的使用、维护和委托修改权。&#x27;],
        [&#x27;ERP-VENDOR-001&#x27;,&#x27;重要分包须经甲方书面同意&#x27;,&#x27;high&#x27;,14,&#x27;乙方可任意分包实施、运维或数据处理且无需通知甲方。&#x27;,&#x27;重要分包须事先书面同意，乙方对分包方承担完整责任。&#x27;],
        [&#x27;ERP-LIABILITY-001&#x27;,&#x27;重大责任不得受一般上限限制&#x27;,&#x27;high&#x27;,15,&#x27;数据、保密、知识产权、故意或重大过失责任适用较低责任上限。&#x27;,&#x27;上述重大责任不适用一般责任上限。&#x27;],
        [&#x27;ERP-EXIT-001&#x27;,&#x27;终止后应提供数据导出和迁移协助&#x27;,&#x27;high&#x27;,16,&#x27;终止后数据导出期限过短、另行高额收费或乙方可立即删除数据。&#x27;,&#x27;提供不少于60日的免费结构化数据导出期和合理迁移协助。&#x27;],
        [&#x27;ERP-RENEW-001&#x27;,&#x27;不得设置默认自动续订&#x27;,&#x27;medium&#x27;,17,&#x27;甲方未在较长提前期提出异议即自动续订。&#x27;,&#x27;续订须由双方另行书面确认。&#x27;],
        [&#x27;ERP-NOTICE-001&#x27;,&#x27;重大通知必须实际送达&#x27;,&#x27;medium&#x27;,17,&#x27;乙方向管理后台发送消息即视为送达。&#x27;,&#x27;重大通知应发送至指定联系人并能够证明实际接收。&#x27;]
      ].map(([id,title,level,principle,trigger,suggestion]) =&gt; ({id,title,level,principle,trigger,suggestion,status:&#x27;pending&#x27;}));

      const showView = (name, step) =&gt; {
        views.forEach(view =&gt; view.classList.toggle(&#x27;is-active&#x27;, view.dataset.view === name));
        steps.forEach(item =&gt; {
          const value = Number(item.dataset.step);
          item.classList.toggle(&#x27;is-active&#x27;, value === step);
          item.classList.toggle(&#x27;is-done&#x27;, value &lt; step);
        });
      };
      const iconRefresh = () =&gt; { if (window.lucide) lucide.createIcons({attrs:{width:16,height:16}}); };
      const pause = ms =&gt; new Promise(resolve =&gt; setTimeout(resolve, ms));
      const formatSize = bytes =&gt; bytes ? `${(bytes / 1024).toFixed(1)} KB` : &#x27;42.3 KB&#x27;;
      const setFile = (name, size) =&gt; {
        selectedFile = name;
        fileName.textContent = name;
        fileSize.textContent = size;
        fileRow.classList.add(&#x27;is-visible&#x27;);
        dropzone.classList.add(&#x27;is-ready&#x27;);
        uploadButton.disabled = false;
      };
      const clearFile = () =&gt; {
        input.value = &#x27;&#x27;;
        selectedFile = &#x27;&#x27;;
        fileRow.classList.remove(&#x27;is-visible&#x27;);
        dropzone.classList.remove(&#x27;is-ready&#x27;);
        uploadButton.disabled = true;
      };
      const runProcess = async ({phase,title,label,stages,nextView,nextStep,orb=&#x27;AI&#x27;,aiRole=&#x27;&#x27;}) =&gt; {
        root.querySelector(&#x27;#ri-process-phase&#x27;).textContent = phase;
        root.querySelector(&#x27;#ri-process-title&#x27;).textContent = title;
        root.querySelector(&#x27;#ri-process-label&#x27;).textContent = label;
        root.querySelector(&#x27;#ri-process-file&#x27;).textContent = selectedFile;
        root.querySelector(&#x27;#ri-orb-label&#x27;).textContent = orb;
        const aiBox = root.querySelector(&#x27;#ri-process-ai&#x27;);
        aiBox.hidden = !aiRole;
        root.querySelector(&#x27;#ri-process-ai-text&#x27;).textContent = aiRole;
        const bar = root.querySelector(&#x27;#ri-progress-bar&#x27;);
        const progress = root.querySelector(&#x27;.ri-progress&#x27;);
        const valueText = root.querySelector(&#x27;#ri-progress-value&#x27;);
        const stepText = root.querySelector(&#x27;#ri-process-step&#x27;);
        bar.style.width = &#x27;0%&#x27;; valueText.textContent = &#x27;0%&#x27;; progress.setAttribute(&#x27;aria-valuenow&#x27;,&#x27;0&#x27;);
        showView(&#x27;processing&#x27;, nextStep);
        for (const [value,text] of stages) {
          await pause(520);
          bar.style.width = `${value}%`;
          valueText.textContent = `${value}%`;
          progress.setAttribute(&#x27;aria-valuenow&#x27;, String(value));
          stepText.textContent = text;
        }
        await pause(450);
        showView(nextView, nextStep);
        iconRefresh();
      };

      input.addEventListener(&#x27;change&#x27;, () =&gt; {
        const file = input.files[0];
        if (file) setFile(file.name, formatSize(file.size));
      });
      dropzone.addEventListener(&#x27;dragover&#x27;, event =&gt; { event.preventDefault(); dropzone.classList.add(&#x27;is-ready&#x27;); });
      dropzone.addEventListener(&#x27;dragleave&#x27;, () =&gt; { if (!selectedFile) dropzone.classList.remove(&#x27;is-ready&#x27;); });
      dropzone.addEventListener(&#x27;drop&#x27;, event =&gt; {
        event.preventDefault();
        const file = event.dataTransfer.files[0];
        if (file) setFile(file.name, formatSize(file.size));
      });
      root.querySelector(&#x27;#ri-sample&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setFile(&#x27;ERP_SaaS私有云采购合同审核原则_精简版.docx&#x27;,&#x27;42.3 KB&#x27;));
      root.querySelector(&#x27;#ri-change-file&#x27;).addEventListener(&#x27;click&#x27;, clearFile);
      root.querySelector(&#x27;#ri-upload&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        uploadButton.disabled = true;
        await runProcess({phase:&#x27;文件上传&#x27;,title:&#x27;正在上传审核原则&#x27;,label:&#x27;上传进度&#x27;,orb:&#x27;上传&#x27;,nextView:&#x27;uploaded&#x27;,nextStep:1,stages:[[12,&#x27;正在建立安全上传通道&#x27;],[31,&#x27;上传Word文件&#x27;],[53,&#x27;校验文件完整性&#x27;],[76,&#x27;提取文档正文与表格&#x27;],[92,&#x27;准备AI识别任务&#x27;],[100,&#x27;文件上传完成&#x27;]]});
        root.querySelector(&#x27;#ri-uploaded-name&#x27;).textContent = selectedFile;
        uploadButton.disabled = false;
      });
      root.querySelector(&#x27;#ri-upload-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { clearFile(); showView(&#x27;upload&#x27;,1); });
      root.querySelector(&#x27;#ri-recognize&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        await runProcess({phase:&#x27;AI原则识别&#x27;,title:&#x27;正在识别审核主题与关键阈值&#x27;,label:&#x27;识别进度&#x27;,nextView:&#x27;principles&#x27;,nextStep:2,aiRole:&#x27;大模型正在读取文档语义，提取审核主题、义务、禁止事项和关键数值阈值，并对重复表达进行合并。&#x27;,stages:[[9,&#x27;识别文档标题与适用范围&#x27;],[24,&#x27;提取付款、价格与验收阈值&#x27;],[41,&#x27;识别私有云、运维与SLA要求&#x27;],[59,&#x27;识别数据安全与数据使用原则&#x27;],[76,&#x27;识别知识产权、责任与退出要求&#x27;],[91,&#x27;合并重复表达并计算置信度&#x27;],[100,&#x27;识别完成，共17项原则&#x27;]]});
        renderPrinciples();
      });
      root.querySelector(&#x27;#ri-principles-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showView(&#x27;upload&#x27;,1));
      root.querySelector(&#x27;#ri-generate&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        await runProcess({phase:&#x27;AI规则拆解&#x27;,title:&#x27;正在生成可执行候选规则&#x27;,label:&#x27;生成进度&#x27;,nextView:&#x27;rules&#x27;,nextStep:3,aiRole:&#x27;大模型正在把抽象原则拆成可执行规则，并生成风险等级、合同触发条件及甲方建议口径，等待法务逐条确认。&#x27;,stages:[[8,&#x27;分析原则中的义务、禁止和阈值&#x27;],[23,&#x27;生成语义触发表达&#x27;],[39,&#x27;拆分复合审核原则&#x27;],[56,&#x27;补充适用范围和风险等级&#x27;],[72,&#x27;生成甲方法务建议条款&#x27;],[88,&#x27;检查候选规则冲突与重复&#x27;],[100,&#x27;生成完成，共26条候选规则&#x27;]]});
        currentFilter = &#x27;all&#x27;; activeRuleId = rules[0].id; renderRules();
      });

      const renderPrinciples = () =&gt; {
        root.querySelector(&#x27;#ri-principles&#x27;).innerHTML = principles.map((item,index) =&gt; `&lt;div class=&quot;ri-principle&quot;&gt;&lt;span class=&quot;ri-principle-num&quot;&gt;${index+1}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${item[0]}&lt;/strong&gt;&lt;span&gt;${item[1]}&lt;/span&gt;&lt;/div&gt;&lt;strong class=&quot;ri-confidence&quot;&gt;${item[2]}%&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      };
      const filteredRules = () =&gt; currentFilter === &#x27;all&#x27; ? rules : rules.filter(rule =&gt; rule.status === currentFilter);
      const statusLabel = status =&gt; ({pending:&#x27;待处理&#x27;,confirmed:&#x27;已采纳&#x27;,excluded:&#x27;不采纳&#x27;})[status];
      const counts = () =&gt; ({pending:rules.filter(r=&gt;r.status===&#x27;pending&#x27;).length,confirmed:rules.filter(r=&gt;r.status===&#x27;confirmed&#x27;).length,excluded:rules.filter(r=&gt;r.status===&#x27;excluded&#x27;).length});
      const renderSummary = () =&gt; {
        const c = counts();
        root.querySelector(&#x27;#ri-rule-summary&#x27;).innerHTML = `&lt;div class=&quot;ri-stat&quot;&gt;&lt;span&gt;候选规则&lt;/span&gt;&lt;strong&gt;26&lt;/strong&gt;&lt;small&gt;由17项原则拆解生成&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;ri-stat&quot;&gt;&lt;span&gt;已采纳&lt;/span&gt;&lt;strong&gt;${c.confirmed}&lt;/strong&gt;&lt;small&gt;将进入后续测试入库任务&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;ri-stat&quot;&gt;&lt;span&gt;待处理&lt;/span&gt;&lt;strong&gt;${c.pending}&lt;/strong&gt;&lt;small&gt;可单条处理或批量采纳&lt;/small&gt;&lt;/div&gt;`;
